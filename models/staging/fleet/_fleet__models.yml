version: 2

models:
  - name: stg_fleet__fuelings
    description: Fuelings deduplicated by content, with the app product mapped to ANP's product name.
    columns:
      - name: fueling_id
        data_tests: [unique, not_null]
      - name: plate
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_fleet__vehicles'), field: plate}}
      - name: driver_id
        data_tests:
          - relationships: {arguments: {to: ref('stg_fleet__drivers'), field: driver_id}}
      - name: anp_product
        description: Null means the app sent a product we do not map yet.
        data_tests: [not_null]
      - name: liters
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0, inclusive: false}}

  - name: stg_fleet__vehicles
    columns:
      - name: plate
        data_tests: [unique, not_null]
      - name: benchmark_km_per_l
        description: Every vehicle model must have specs in seeds/vehicle_models.csv.
        data_tests: [not_null]

  - name: stg_fleet__drivers
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
